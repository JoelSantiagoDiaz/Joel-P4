<head>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
</head>
<body>
<a-scene>
  <a-assets>
    <img id="suelo" src="suelos.jpg">
    <img id="pared" src="paredes.jpg">
    <img id="viga" src="vigas.jpg">
    <img id="cielo" src="campo.jpg">
  </a-assets>
  <a-box position="0 0.1 0"width="3"height="0.2"depth="3"src="#suelo"></a-box>
  <a-box position="0 1.7 -1.4"rotation="90 90 90"width="3"height="0.2"depth="3"src="#pared"></a-box>
  <a-box position="1.4 1.7 -1.125"rotation="90 0 90"width="0.75"height="0.2"depth="3"src="#pared"></a-box>
  <a-box position="1.4 1.7 1.125"rotation="90 0 90"width="0.75"height="0.2"depth="3"src="#pared"></a-box>
  <a-box position="1.4 2.825 0"rotation="90 0 90"width="1.5"height="0.2"depth="0.75"src="#pared"></a-box>
  <a-box position="1.4 0.575 0"rotation="90 0 90"width="1.5"height="0.2"depth="0.75"src="#pared"></a-box>
  <a-box position="-1.4 1.7 0"rotation="90 0 90"width="3"height="0.2"depth="3"src="#pared"></a-box>
  <a-box position="0 3.2 0"width="3"height="0.2"depth="3"src="#viga"></a-box>
  <a-entity position="0 1 3"><a-camera></a-camera>
  <a-sky src="#cielo" rotation="0 0 0"></a-sky>
</a-scene>

</html>
